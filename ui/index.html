<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BattDock</title>
<link rel="stylesheet" href="./common.css" />
<style>
  .main-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .section-meta {
    flex-shrink: 0;
    font-size: 13px;
    color: var(--text-secondary);
    padding: 0 2px 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .device-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 列表密度变体 */
  .density-compact .device-list { gap: 7px; }
  .density-compact .device-card { padding: 9px 14px; }
  .density-standard .device-list { gap: 9px; }
  .density-standard .device-card { padding: 11px 16px; }
  .density-comfortable .device-list { gap: 10px; }
  .density-comfortable .device-card { padding: 13px 16px; }

  /* 设备卡片：状态颜色 200ms 平滑过渡 */
  .device-card {
    flex-shrink: 0;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 11px;
    box-shadow: var(--shadow-card);
    transition: background-color 200ms var(--ease-out), border-color 200ms var(--ease-out), opacity 200ms var(--ease-out);
  }

  .device-card:hover {
    border-color: var(--border-input);
  }

  .device-card.level-tier2 {
    background: var(--warn-card-bg);
    border-color: var(--warn-card-border);
  }

  .device-card.level-tier3 {
    background: var(--crit-card-bg);
    border-color: var(--crit-card-border);
  }

  .device-card.level-offline {
    opacity: 0.72;
  }

  .card-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .dev-icon-box {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--bg-icon-box);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color 200ms var(--ease-out);
  }

  .level-tier2 .dev-icon-box { background: var(--warn-icon-bg); }
  .level-tier3 .dev-icon-box { background: var(--crit-icon-bg); }
  .hide-icons .dev-icon-box { display: none; }

  .dev-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .dev-name-line {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .dev-name {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dev-sub {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chg-inline {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    color: var(--bat-charging);
    font-weight: 500;
  }

  /* 电量进度条：350ms 宽度平滑过渡 + 200ms 状态色平滑过渡 */
  .progress-wrap {
    margin-top: 6px;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: var(--track-bg);
    overflow: hidden;
  }

  .hide-bars .progress-wrap { display: none; }

  .progress-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 350ms var(--ease-out), background-color 200ms var(--ease-out);
  }

  .fill-normal, .fill-charging { background: var(--bat-normal); }
  .fill-tier1 { background: var(--bat-tier1); }
  .fill-tier2 { background: var(--bat-tier2); }
  .fill-tier3 { background: var(--bat-tier3); }
  .fill-offline, .fill-unknown { background: var(--bat-offline); }

  .dev-right {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 6px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    transition: background-color 200ms var(--ease-out), color 200ms var(--ease-out);
  }

  .status-pill.warn {
    background: var(--warn-badge-bg);
    color: var(--warn-badge-text);
  }

  .status-pill.crit {
    background: var(--crit-badge-bg);
    color: var(--crit-badge-text);
  }

  .dev-pct {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    min-width: 48px;
    text-align: right;
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    transition: color 200ms var(--ease-out);
  }

  .dev-pct.warn { color: var(--warn-pct-text); }
  .dev-pct.crit { color: var(--crit-pct-text); }
  .dev-pct.muted {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
  }

  /* 多电池耳塞组合卡片 */
  .sub-grid {
    margin-top: 12px;
    padding-left: 56px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
  }

  .hide-icons .sub-grid { padding-left: 0; }

  .sub-item {
    padding: 0 16px 0 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sub-item + .sub-item {
    padding-left: 16px;
    border-left: 1px solid var(--border-hairline);
  }

  .sub-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sub-ico {
    color: var(--text-secondary);
    display: inline-flex;
    flex-shrink: 0;
  }

  .sub-meta {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .sub-title {
    font-size: 11.5px;
    color: var(--text-secondary);
  }

  .sub-pct {
    font-size: 14.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }

  .sub-pct.unknown {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
  }

  /* 空状态 */
  .empty-state {
    flex: 1;
    min-height: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    background: var(--bg-card);
    border: 1px dashed var(--border-input);
    border-radius: 12px;
    padding: 28px 20px;
    color: var(--text-secondary);
  }

  .empty-ico {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--bg-icon-box);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }

  .empty-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .empty-desc {
    font-size: 12.5px;
    max-width: 340px;
    color: var(--text-secondary);
  }

  /* 底部状态栏 */
  .statusbar {
    flex-shrink: 0;
    height: 46px;
    padding: 0 20px;
    background: var(--bg-titlebar);
    border-top: 1px solid var(--border-hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-secondary);
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .monitor-state {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22C55E;
    transition: background-color 200ms var(--ease-out);
  }

  .status-dot.paused {
    background: #94A3B8;
  }

  .refresh-btn.spinning svg {
    animation: spin 600ms linear 1;
  }

  .status-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .update-pill {
    display: none;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid rgba(59, 130, 246, 0.28);
    background: var(--brand-soft);
    color: var(--brand);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 120ms var(--ease-out), transform 100ms var(--ease-out);
  }
  .update-pill.show { display: inline-flex; }
  .update-pill:hover { background: rgba(59, 130, 246, 0.18); }
  .update-pill:active { transform: scale(0.97); }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div id="toast" class="toast-bar"></div>
  <div id="appShell" class="app-shell density-comfortable">
    <!-- 顶部标题栏 -->
    <div id="titlebar" class="titlebar">
      <div class="titlebar-left">
        <div class="app-logo" aria-hidden="true">

        <span class="app-title">BattDock</span>
      </div>
      <div class="titlebar-controls">
        <button class="win-btn" title="设置" onclick="openSettings()">

          </svg>
        </button>
        <button class="win-btn" title="最小化" onclick="minimizeWin()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button id="maxBtn" class="win-btn" title="最大化" onclick="toggleMax()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>
        </button>
        <button class="win-btn close" title="关闭" onclick="closeWin()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-body">
      <div class="section-meta">
        <span id="deviceCountText">已连接设备 · 0 个</span>
      </div>
      <div id="deviceList" class="device-list"></div>
    </main>

    <!-- 底部状态栏 -->
    <footer class="statusbar">
      <div class="status-left">
        <span id="updatedText">最近更新: 正在检测...</span>
        <span class="monitor-state">
          <span id="monitorDot" class="status-dot"></span>
          <span id="monitorText">自动监控已开启</span>
        </span>
      </div>
      <div class="status-right">
        <button id="updatePill" class="update-pill" onclick="openUpdateSettings()" title="点击查看并更新软件">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><polyline points="5 12 12 5 19 12"/></svg>
          <span id="updatePillText">发现新版本</span>
        </button>
        <button id="refreshBtn" class="btn refresh-btn" onclick="refreshNow()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
          <span id="refreshLabel">刷新</span>
        </button>
      </div>
    </footer>
  </div>

<script>
  let appState = null;
  let refreshTimer = null;
  // 按 device_id 复用卡片 DOM，确保进度条仅在真实电量变动时触发 350ms 过渡，零闪烁

    earbuds: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.1 13.6C3.9 7.2 7.2 2.6 12 2.6C16.8 2.6 20.1 7.2 19.9 13.6H17.1C17.2 8.7 15.1 5.4 12 5.4C8.9 5.4 6.8 8.7 6.9 13.6H4.1Z"/><rect x="2.9" y="12.2" width="4.7" height="8.9" rx="2.15" transform="rotate(-9 5.25 16.65)"/><rect x="16.4" y="12.2" width="4.7" height="8.9" rx="2.15" transform="rotate(9 18.75 16.65)"/></svg>`,

    budRight: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="13" cy="8" r="3.5"/><path d="M11.5 11.2V19"/></svg>`,
    budCase: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="6" width="16" height="12" rx="4"/><line x1="4" y1="11" x2="20" y2="11"/></svg>`,
    bolt: `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 10-12h-7l0-8z"/></svg>`,
    lowBat: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="17" height="10" rx="2"/><line x1="22" y1="10" x2="22" y2="14"/><rect x="5" y="10" width="3.5" height="4" fill="currentColor" stroke="none"/></svg>`
  };

  function escHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  (function attachWindowDrag() {
    const bar = document.getElementById("titlebar");
    let dragging = false, moved = false, sx = 0, sy = 0;
    bar.addEventListener("mousedown", (e) => {
      if (e.button !== 0 || e.target.closest("button")) return;
      dragging = true; moved = false; sx = e.screenX; sy = e.screenY;
      window.pywebview?.api?.begin_drag(sx, sy);
    });
    bar.addEventListener("dblclick", (e) => { if (!e.target.closest("button")) toggleMax(); });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      if (Math.abs(e.screenX - sx) > 3 || Math.abs(e.screenY - sy) > 3) moved = true;
      if (moved) window.pywebview?.api?.drag_move(e.screenX, e.screenY);
    });
    window.addEventListener("mouseup", () => {
      if (!dragging) return;
      dragging = false;
      if (moved) window.pywebview?.api?.end_drag();
    });
  })();

  function subBarClass(pct, chg) {
    if (pct === null || pct === undefined) return "fill-unknown";
    if (chg || pct > 30) return "fill-normal";
    if (pct > 20) return "fill-tier1";
    if (pct > 10) return "fill-tier2";
    return "fill-tier3";
  }

  function createCardElement(dev) {
    const el = document.createElement("article");
    el.dataset.did = dev.device_id;
    el.dataset.multi = dev.sub_batteries ? "1" : "0";
    if (dev.sub_batteries) {
      el.innerHTML = `
        <div class="card-row">
          <div class="dev-icon-box">${ICONS.earbuds}</div>
          <div class="dev-main">
            <div class="dev-name-line"><span class="dev-name"></span></div>
            <div class="dev-sub"></div>
          </div>
        </div>
        <div class="sub-grid">
          <div class="sub-item" data-part="left">
            <div class="sub-head"><span class="sub-ico">${ICONS.budLeft}</span><div class="sub-meta"><span class="sub-title">左耳电量</span><span class="sub-pct"></span></div></div>
            <div class="progress-wrap"><div class="progress-fill"></div></div>
          </div>
          <div class="sub-item" data-part="right">
            <div class="sub-head"><span class="sub-ico">${ICONS.budRight}</span><div class="sub-meta"><span class="sub-title">右耳电量</span><span class="sub-pct"></span></div></div>
            <div class="progress-wrap"><div class="progress-fill"></div></div>
          </div>
          <div class="sub-item" data-part="case">
            <div class="sub-head"><span class="sub-ico">${ICONS.budCase}</span><div class="sub-meta"><span class="sub-title">充电盒电量</span><span class="sub-pct"></span></div></div>
            <div class="progress-wrap"><div class="progress-fill"></div></div>
          </div>
        </div>`;
    } else {
      el.innerHTML = `
        <div class="card-row">
          <div class="dev-icon-box"></div>
          <div class="dev-main">
            <div class="dev-name-line"><span class="dev-name"></span></div>
            <div class="dev-sub"></div>
            <div class="progress-wrap"><div class="progress-fill"></div></div>
          </div>
          <div class="dev-right"></div>
        </div>`;
    }
    return el;
  }

  function patchCardElement(el, dev) {
    const lvl = dev.alert_level || "normal";
    el.className = `device-card level-${lvl}`;
    const fullName = dev.display_name || dev.name || "";
    const nameEl = el.querySelector(".dev-name");
    nameEl.textContent = fullName;
    nameEl.title = fullName;

    const conn = escHtml(dev.connection_label || "");
    const hasPct = dev.percent !== null && dev.percent !== undefined;

    if (dev.sub_batteries) {
      let subHtml = "";
      if (dev.charging) {
        subHtml = conn ? `<span>${conn}</span><span>·</span><span class="chg-inline">${ICONS.bolt}充电中</span>` : `<span class="chg-inline">${ICONS.bolt}充电中</span>`;
      } else if (!dev.connected) {
        subHtml = conn ? `<span>${conn}</span><span>·</span><span>未连接</span>` : `<span>未连接</span>`;
      } else if (conn) {
        subHtml = `<span>${conn}</span>`;
      }
      el.querySelector(".dev-sub").innerHTML = subHtml;
      const sb = dev.sub_batteries;
      const parts = [
        ["left", sb.left_percent, sb.left_charging],
        ["right", sb.right_percent, sb.right_charging],
        ["case", sb.case_percent, sb.case_charging],
      ];
      parts.forEach(([key, pct, chg]) => {
        const item = el.querySelector(`.sub-item[data-part="${key}"]`);
        const known = pct !== null && pct !== undefined;
        const pctEl = item.querySelector(".sub-pct");
        pctEl.className = known ? "sub-pct" : "sub-pct unknown";
        pctEl.textContent = known ? `${pct}%${chg ? " ⚡" : ""}` : "—";
        const fill = item.querySelector(".progress-fill");
        fill.className = `progress-fill ${subBarClass(pct, chg)}`;
        const nextW = `${known ? Math.max(0, Math.min(100, pct)) : 0}%`;
        if (fill.style.width !== nextW) fill.style.width = nextW;
      });
      return;
    }

    const iconBox = el.querySelector(".dev-icon-box");
    const iconHtml = ICONS[dev.kind] || ICONS.other;
    if (iconBox.dataset.kind !== dev.kind) {
      iconBox.innerHTML = iconHtml;
      iconBox.dataset.kind = dev.kind || "other";
    }

    // 副标题规范：“连接方式” 或 “连接方式 · 特殊状态”（正常连接不重复写“已连接”，左右不重复状态文案）
    let statePart = "";
    if (!dev.connected) statePart = `<span>未连接</span>`;
    else if (dev.asleep) statePart = `<span>休眠中</span>`;
    else if (dev.full || (dev.charging && hasPct && dev.percent >= 100)) statePart = `<span class="chg-inline">${ICONS.bolt}已充满</span>`;
    else if (dev.charging) statePart = `<span class="chg-inline">${ICONS.bolt}充电中</span>`;
    else if (!dev.online && !hasPct) statePart = `<span>未连接</span>`;

    const subHtml = conn && statePart
      ? `<span>${conn}</span><span>·</span>${statePart}`
      : (conn ? `<span>${conn}</span>` : statePart);
    const subEl = el.querySelector(".dev-sub");
    if (subEl.dataset.sig !== subHtml) {
      subEl.innerHTML = subHtml;
      subEl.dataset.sig = subHtml;
    }

    const fill = el.querySelector(".progress-fill");
    const nextCls = `progress-fill fill-${lvl}`;
    if (fill.className !== nextCls) fill.className = nextCls;
    const nextW = `${hasPct ? Math.max(0, Math.min(100, dev.percent)) : 0}%`;
    if (fill.style.width !== nextW) fill.style.width = nextW;

    let rightHtml = "";
    if (!hasPct) {
      rightHtml = `<span class="dev-pct muted">—</span>`;
    } else if (lvl === "tier3") {
      rightHtml = `<span style="color:var(--crit-pct-text);display:inline-flex">${ICONS.lowBat}</span><span class="status-pill crit">电量紧急</span><span class="dev-pct crit">${dev.percent}%</span>`;
    } else if (lvl === "tier2") {
      rightHtml = `<span style="color:var(--warn-pct-text);display:inline-flex">${ICONS.lowBat}</span><span class="status-pill warn">低电量</span><span class="dev-pct warn">${dev.percent}%</span>`;
    } else if (dev.charging) {
      rightHtml = `<span class="dev-pct"><span style="color:var(--bat-charging);display:inline-flex">${ICONS.bolt}</span>${dev.percent}%</span>`;
    } else {
      rightHtml = `<span class="dev-pct">${dev.percent}%</span>`;
    }
    const rightEl = el.querySelector(".dev-right");
    if (rightEl.dataset.sig !== rightHtml) {
      rightEl.innerHTML = rightHtml;
      rightEl.dataset.sig = rightHtml;
    }
  }

  function applyState(state) {
    appState = state;
    if (state.device_icons) {
      Object.assign(ICONS, state.device_icons);
    }
    const cfg = state.config || {};
    document.documentElement.dataset.theme = state.effective_theme || "light";
    document.documentElement.dataset.colors = cfg.color_scheme || "standard";
    document.documentElement.dataset.anim = state.effective_animations === false ? "off" : "on";
    document.body.style.zoom = `${(cfg.ui_scale || 100) / 100}`;

    const shell = document.getElementById("appShell");
    shell.classList.remove("density-compact", "density-standard", "density-comfortable");
    shell.classList.add(`density-${cfg.list_density || "comfortable"}`);
    shell.classList.toggle("hide-bars", cfg.show_progress_bar === false);
    shell.classList.toggle("hide-icons", cfg.show_device_icon === false);
    shell.classList.toggle("maximized", Boolean(state.main_maximized));

    const devs = state.devices || [];
    document.getElementById("deviceCountText").textContent = `已连接设备 · ${devs.length} 个`;

    const listEl = document.getElementById("deviceList");
    if (devs.length === 0) {
      cardRegistry.clear();
      if (!listEl.querySelector(".empty-state")) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-ico">${ICONS.mouse}</div>
            <div class="empty-title">暂未检测到已连接的无线外设</div>
            <div class="empty-desc">请确认 2.4GHz 接收器已插入或蓝牙外设已连接，也可以点击下方按钮手动重新扫描。</div>
            <button class="btn btn-primary" onclick="refreshNow()">立即扫描设备</button>
          </div>`;
      }
    } else {
      const empty = listEl.querySelector(".empty-state");
      if (empty) empty.remove();
      const aliveIds = new Set(devs.map((d) => d.device_id));
      for (const [id, node] of cardRegistry.entries()) {
        if (!aliveIds.has(id)) {
          node.remove();
          cardRegistry.delete(id);
        }
      }
      devs.forEach((dev, idx) => {
        let node = cardRegistry.get(dev.device_id);
        const wantMulti = dev.sub_batteries ? "1" : "0";
        if (!node || node.dataset.multi !== wantMulti) {
          if (node) node.remove();
          node = createCardElement(dev);
          cardRegistry.set(dev.device_id, node);
        }
        patchCardElement(node, dev);
        if (listEl.children[idx] !== node) {
          listEl.insertBefore(node, listEl.children[idx] || null);
        }
      });
    }

    document.getElementById("updatedText").textContent = state.updated_str
      ? `最近更新: ${state.updated_str}`
      : "最近更新: 尚未刷新";

    const dot = document.getElementById("monitorDot");
    const mText = document.getElementById("monitorText");
    dot.classList.toggle("paused", !state.auto_monitor);
    mText.textContent = state.auto_monitor ? "自动监控已开启" : "自动监控已暂停";

    const upd = state.update_state || {};
    const pill = document.getElementById("updatePill");
    const pillText = document.getElementById("updatePillText");
    if (pill && pillText) {
      const busy = upd.status === "downloading" || upd.status === "verifying" || upd.status === "preparing" || upd.status === "restarting";
      const showUpd = (!upd.dismissed && upd.status === "available") || busy;
      pill.classList.toggle("show", showUpd);
      if (upd.status === "downloading") {
        pillText.textContent = `正在下载更新… ${upd.progress || 0}%`;
      } else if (upd.status === "verifying") {
        pillText.textContent = "正在校验文件…";
      } else if (upd.status === "preparing") {
        pillText.textContent = "正在准备安装…";
      } else if (upd.status === "restarting") {
        pillText.textContent = "正在重启软件…";
      } else if (upd.latest_version) {
        pillText.textContent = `发现新版 v${upd.latest_version}`;
      }
    }
  }

  function refreshNow() {
    const btn = document.getElementById("refreshBtn");
    const lbl = document.getElementById("refreshLabel");
    btn.classList.remove("spinning");
    void btn.offsetWidth;
    btn.classList.add("spinning");
    lbl.textContent = "刷新中...";
    window.pywebview?.api?.refresh_now();
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      btn.classList.remove("spinning");
      lbl.textContent = "刷新";
    }, 620);
  }

  // 窗口最小化或隐藏至托盘后停止任何进行中的前端动画
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearTimeout(refreshTimer);
      const btn = document.getElementById("refreshBtn");
      btn.classList.remove("spinning");
      document.getElementById("refreshLabel").textContent = "刷新";
    }
  });

  function openSettings() { window.pywebview?.api?.open_settings("general"); }
  function openUpdateSettings() { window.pywebview?.api?.open_settings("about"); }
  function minimizeWin() { window.pywebview?.api?.minimize_window(); }
  function toggleMax() { window.pywebview?.api?.toggle_maximize(); }
  function closeWin() { window.pywebview?.api?.close_window(); }

  window.addEventListener("keydown", (e) => {
    if (e.key === "F5" || (e.ctrlKey && e.key.toLowerCase() === "r")) {
      e.preventDefault();
      refreshNow();
    } else if (e.ctrlKey && e.key === ",") {
      e.preventDefault();
      openSettings();
    }
  });

  let _uiReadySent = false;
  function notifyReadyOnce() {
    if (_uiReadySent) return;
    _uiReadySent = true;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        window.pywebview?.api?.ui_ready();
      });
    });
  }

  window.addEventListener("pywebviewready", () => {
    window.pywebview.api.get_initial_state().then((st) => {
      applyState(st);
      notifyReadyOnce();
    });
  });
</script>
</body>
</html>
